<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModCodX | Minecraft Cheat Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
        }

        .logo span {
            color: #4ec9b0;
        }

        .sub {
            color: #555;
            font-size: 12px;
        }

        .workspace {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .main-editor {
            flex: 3;
            min-width: 400px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }

        .editor-header {
            background: #141414;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            color: #4ec9b0;
            font-size: 13px;
            font-weight: 600;
        }

        .editor-badge {
            background: #1e1e1e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #888;
        }

        .code-panel {
            display: flex;
            min-height: 550px;
        }

        .line-numbers {
            padding: 20px 12px;
            text-align: right;
            color: #3a3a3a;
            font-size: 12px;
            line-height: 1.6;
            border-right: 1px solid #222;
            background: #0d0d0d;
        }

        .code-area {
            flex: 1;
            padding: 20px;
            background: #0d0d0d;
            overflow-y: auto;
        }

        #codeDisplay {
            color: #d4d4d4;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: #aaa;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .side-panel {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dev-window {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
        }

        .dev-header {
            background: #141414;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .dev-name {
            font-size: 11px;
            font-weight: 600;
            color: #e8e8e8;
        }

        .dev-status {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            background: #1a3a1a;
            color: #4ec9b0;
        }

        .dev-code {
            padding: 10px 12px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: #aaa;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .dev-progress {
            height: 2px;
            background: #222;
        }

        .dev-progress-fill {
            height: 100%;
            width: 0%;
            background: #4ec9b0;
            transition: width 0.1s linear;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info {
            color: #555;
            font-size: 11px;
        }

        button {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            padding: 6px 18px;
            color: #ddd;
            font-family: monospace;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        button:hover {
            background: #252525;
            border-color: #4ec9b0;
            color: #4ec9b0;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <div class="logo">Mod<span>Cod</span>X</div>
            <div class="sub">Minecraft Cheat Development Studio</div>
        </div>
        <div class="info">⚡ collaborative coding · 6 developers online</div>
    </div>

    <div class="workspace">
        <div class="main-editor">
            <div class="editor-header">
                <div class="editor-title">📁 YOU · main.cpp</div>
                <div class="editor-badge">lead developer</div>
            </div>
            <div class="code-panel">
                <div class="line-numbers" id="lineNumbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17<br>18<br>19<br>20</div>
                <div class="code-area">
                    <div id="codeDisplay"></div>
                    <span class="cursor"></span>
                </div>
            </div>
        </div>

        <div class="side-panel" id="sidePanel"></div>
    </div>

    <div class="footer">
        <div class="info">⌨️ Press any key — your code appears</div>
        <div class="info" id="progressInfo">your progress: 0%</div>
        <button onclick="resetMainCode()">⟳ reset your code</button>
    </div>
</div>

<script>
    // ========== ТВОЙ КОД ==========
    const yourCode = `#include <iostream>
#include <vector>
#include "MinecraftCheat.h"

using namespace std;

class KillAura {
private:
    float range = 3.4f;
    float cps = 12.5f;
    bool silent = true;
    
public:
    void update() {
        Entity target = getNearestEntity();
        if (target.isValid() && distance(target) <= range) {
            attack(target);
            if (silent) {
                rotateCamera(target);
            }
        }
    }
    
    Entity getNearestEntity() {
        Entity* best = nullptr;
        float bestDist = range;
        for (Entity e : world.getEntities()) {
            if (e.isPlayer() && !e.isFriend()) {
                float dist = getDistance(e);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = &e;
                }
            }
        }
        return *best;
    }
};

int main() {
    KillAura aura;
    while (true) {
        aura.update();
        Sleep(1000 / 20);
    }
    return 0;
}`;

    // ========== КОДЫ ДЛЯ 5 РАЗРАБОТЧИКОВ ==========
    const devCodes = [
        { name: "nexus", code: `// AntiCheat Bypass v2
#include "Bypass.h"

void bypassGrim() {
    while (true) {
        sendFakeRotation();
        delay(10);
        cancelVelocity();
    }
}` },
        { name: "vortex", code: `// Visual Engine
class Renderer {
    void drawESP(Entity e) {
        Box box = e.getBoundingBox();
        drawOutline(box, Color(0,255,0));
        drawNametag(e.getName());
        drawHealthBar(e.getHealth());
    }
}` },
        { name: "zenix", code: `// Reach Module
float reachDistance = 3.8f;
bool hitThroughWalls = false;

void onAttack(Entity target) {
    if (getDistance(target) <= reachDistance) {
        target.damage(7.0f);
        if (hitThroughWalls) {
            ignoreCollision(target);
        }
    }
}` },
        { name: "karma", code: `// Velocity Reducer
void onHurt(Vector3 velocity) {
    float reduction = 0.85f;
    velocity.x *= reduction;
    velocity.z *= reduction;
    if (isInAir()) {
        velocity.y *= 0.9f;
    }
    setVelocity(velocity);
}` },
        { name: "lunar", code: `// Fly & Speed
bool flyMode = true;
float flySpeed = 0.3f;

void onTick() {
    if (flyMode && !isOnGround()) {
        setMotion(flySpeed, 0, flySpeed);
    }
}` }
    ];

    // Скорости от 18 до 40 символов в секунду
    const devSpeeds = [22, 35, 28, 40, 18];

    let devStates = devCodes.map((dev, idx) => ({
        name: dev.name,
        fullCode: dev.code,
        currentIndex: 0,
        displayText: "",
        speed: devSpeeds[idx],
        lastUpdate: performance.now(),
        totalChars: dev.code.length
    }));

    let mainIndex = 0;
    let mainDisplay = "";
    const mainTotal = yourCode.length;

    const codeDisplay = document.getElementById("codeDisplay");
    const lineNumbersDiv = document.getElementById("lineNumbers");
    const progressInfo = document.getElementById("progressInfo");
    const sidePanel = document.getElementById("sidePanel");

    function updateMainCode() {
        let escaped = mainDisplay.replace(/&/g, '&amp;')
                                 .replace(/</g, '&lt;')
                                 .replace(/>/g, '&gt;')
                                 .replace(/ /g, '&nbsp;');
        codeDisplay.innerHTML = escaped;
        
        const lines = mainDisplay.split('\n');
        let lineHtml = "";
        for (let i = 1; i <= Math.max(lines.length, 20); i++) {
            lineHtml += i + "<br>";
        }
        lineNumbersDiv.innerHTML = lineHtml;
        
        const percent = Math.floor((mainIndex / mainTotal) * 100);
        progressInfo.innerText = `your progress: ${percent}%`;
        
        const container = document.querySelector(".code-area");
        if (container) container.scrollTop = container.scrollHeight;
    }

    function addMainChar() {
        if (mainIndex < mainTotal) {
            mainDisplay += yourCode[mainIndex];
            mainIndex++;
            updateMainCode();
        }
    }

    function renderDevWindows() {
        sidePanel.innerHTML = "";
        for (let i = 0; i < devStates.length; i++) {
            const dev = devStates[i];
            const percent = Math.floor((dev.currentIndex / dev.totalChars) * 100);
            
            let codePreview = dev.displayText;
            if (codePreview.length > 120) {
                codePreview = codePreview.substring(0, 117) + "...";
            }
            let escapedCode = codePreview.replace(/&/g, '&amp;')
                                         .replace(/</g, '&lt;')
                                         .replace(/>/g, '&gt;');
            
            const windowDiv = document.createElement('div');
            windowDiv.className = 'dev-window';
            windowDiv.innerHTML = `
                <div class="dev-header">
                    <span class="dev-name">${dev.name}</span>
                    <span class="dev-status">${percent}%</span>
                </div>
                <div class="dev-code">${escapedCode}</div>
                <div class="dev-progress">
                    <div class="dev-progress-fill" style="width: ${percent}%"></div>
                </div>
            `;
            sidePanel.appendChild(windowDiv);
        }
    }

    function updateDevCode(dev, now) {
        const timeDelta = Math.min(0.1, (now - dev.lastUpdate) / 1000);
        const charsToAdd = Math.floor(dev.speed * timeDelta);
        
        if (charsToAdd > 0 && dev.currentIndex < dev.totalChars) {
            let newIndex = Math.min(dev.currentIndex + charsToAdd, dev.totalChars);
            dev.displayText += dev.fullCode.substring(dev.currentIndex, newIndex);
            dev.currentIndex = newIndex;
        }
        dev.lastUpdate = now;
    }

    function animateDevs(now) {
        let anyActive = false;
        for (let i = 0; i < devStates.length; i++) {
            if (devStates[i].currentIndex < devStates[i].totalChars) {
                anyActive = true;
                updateDevCode(devStates[i], now);
            }
        }
        renderDevWindows();
        if (anyActive) {
            requestAnimationFrame(animateDevs);
        }
    }

    function onKeyPress(e) {
        const ignore = ["Control", "Alt", "Shift", "Meta", "Escape", "Tab", 
                       "CapsLock", "NumLock", "ScrollLock", "Pause", "Insert",
                       "Home", "PageUp", "Delete", "End", "PageDown"];
        if (ignore.includes(e.key)) return;
        addMainChar();
        if (mainIndex >= mainTotal) {
            document.removeEventListener("keydown", onKeyPress);
        }
    }

    function resetMainCode() {
        mainDisplay = "";
        mainIndex = 0;
        updateMainCode();
        document.addEventListener("keydown", onKeyPress);
    }

    updateMainCode();
    renderDevWindows();
    document.addEventListener("keydown", onKeyPress);
    requestAnimationFrame(animateDevs);
</script>
</body>
</html>
