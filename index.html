using namespace std;

class KillAura {
private:
    float range = 3.4f;
    float cps = 12.5f;
    bool silent = true;
    
public:
    void update() {
        Entity target = getNearestEntity();
        if (target.isValid() && getDistance(target) <= range) {
            attack(target);
        }
    }
    
    Entity getNearestEntity() {
        Entity* best = nullptr;
        float bestDist = range;
        for (Entity e : world.getEntities()) {
            if (e.isPlayer() && !e.isFriend()) {
                float dist = getDistance(e);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = &e;
                }
            }
        }
        return *best;
    }
};

int main() {
    KillAura aura;
    while (true) {
        aura.update();
        this_thread::sleep_for(chrono::milliseconds(50));
    }

// Features: Extended Reach, Hitbox Expansion, ThroughWalls, BackTrack

class ReachModule {
private:
    float reachDistance = 3.8f;
    float hitboxSize = 0.8f;
    bool hitThroughWalls = false;
    bool expandedHitbox = true;
    bool backtrackEnabled = true;
    int backtrackTicks = 5;

    ReachModule() {

        hitHistory.reserve(20);

    void onAttack(Entity target) {
        if (isValidTarget(target)) {
            if (hitThroughWalls) {
                ignoreCollision(target);
            }
            if (expandedHitbox) {
                target.setHitbox(hitboxSize);
            }
            if (backtrackEnabled) {

            }
            applyDamage(target, 7.0f);
            recordHit(target.getPos());

        if (newReach >= 3.0f && newReach <= 6.0f) {

        }

    void setHitboxSize(float size) {

        hitThroughWalls = !hitThroughWalls;

            Vector3 oldPos = hitHistory[hitHistory.size() - backtrackTicks];
            target.setPosition(oldPos);
        }

                                 .replace(/>/g, '&gt;')
                                 .replace(/ /g, '&nbsp;');
        codeDisplay.innerHTML = escaped;
        
        const lines = mainDisplay.split('\n');
        let lineHtml = "";
        for (let i = 1; i <= Math.max(lines.length, 20); i++) {
            lineHtml += i + "<br>";
        }
        lineNumbersDiv.innerHTML = lineHtml;

        const container = document.querySelector(".code-area");
        if (container) container.scrollTop = container.scrollHeight;

            mainDisplay += yourCode[mainIndex];
            mainIndex++;

        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modalTitle");
        const modalCode = document.getElementById("modalCode");

        modalCode.innerText = fullCodeText;
        modal.classList.add("active");

        modal.classList.remove("active");

    // Drag & Drop

    function handleDragStart(e, idx) {
        draggedItem = idx;
        e.target.closest('.dev-window')?.classList.add('dragging');
    }

    function handleDragOver(e, idx) {
        e.preventDefault();
        if (draggedItem === null) return;
        
        if (draggedItem !== idx) {
            const items = [...devStates];
            const [dragged] = items.splice(draggedItem, 1);

            devStates = items;
            draggedItem = idx;
            renderDevWindows();
        }

    function handleDragEnd(e) {
        draggedItem = null;
        document.querySelectorAll('.dev-window').forEach(el => el.classList.remove('dragging'));

    function renderDevWindows() {
        sidePanel.innerHTML = "";
        for (let i = 0; i < devStates.length; i++) {
            const dev = devStates[i];
            const percent = Math.floor((dev.currentIndex / dev.totalChars) * 100);
            
            let codePreview = dev.displayText;
            if (codePreview.length > 150) {
                codePreview = codePreview.substring(0, 147) + "...";
            }
            let escapedCode = codePreview.replace(/&/g, '&amp;')
                                         .replace(/</g, '&lt;')
                                         .replace(/>/g, '&gt;');
            
            const windowDiv = document.createElement('div');
            windowDiv.className = 'dev-window';
            windowDiv.setAttribute('draggable', 'true');
            
            windowDiv.innerHTML = `
                <div class="dev-header">
                    <span class="dev-name">${dev.name}</span>
                    <div class="dev-controls">
                        <span class="dev-status">${percent}%</span>
                        <button class="expand-btn" data-name="${dev.name}" data-code="${dev.fullCode.replace(/"/g, '&quot;').replace(/\n/g, '\\n')}">⤢</button>
                    </div>
                </div>
                <div class="dev-code">${escapedCode}</div>
                <div class="dev-progress">
                    <div class="dev-progress-fill" style="width: ${percent}%"></div>
                </div>
            `;
            
            windowDiv.addEventListener('dragstart', (e) => handleDragStart(e, i));
            windowDiv.addEventListener('dragover', (e) => handleDragOver(e, i));
            windowDiv.addEventListener('dragend', handleDragEnd);
            
            const expandBtn = windowDiv.querySelector('.expand-btn');
            expandBtn.addEventListener('click', () => {
                openModal(expandBtn.dataset.name, dev.fullCode);
            });
            
            sidePanel.appendChild(windowDiv);
        }
    }

    function updateDevCode(dev, now) {
        const timeDelta = Math.min(0.1, (now - dev.lastUpdate) / 1000);
        const charsToAdd = Math.floor(dev.speed * timeDelta);
        
        if (charsToAdd > 0 && dev.currentIndex < dev.totalChars) {
            let newIndex = Math.min(dev.currentIndex + charsToAdd, dev.totalChars);
            dev.displayText += dev.fullCode.substring(dev.currentIndex, newIndex);
            dev.currentIndex = newIndex;
        }
        dev.lastUpdate = now;
    }

    function animateDevs(now) {
        for (let i = 0; i < devStates.length; i++) {
            if (devStates[i].currentIndex < devStates[i].totalChars) {
                updateDevCode(devStates[i], now);
            }
        }
        renderDevWindows();
        requestAnimationFrame(animateDevs);
    }

    function onKeyPress(e) {
        const ignore = ["Control", "Alt", "Shift", "Meta", "Escape", "Tab", 
                       "CapsLock", "NumLock", "ScrollLock", "Pause", "Insert",
                       "Home", "PageUp", "Delete", "End", "PageDown", "ArrowUp", 
                       "ArrowDown", "ArrowLeft", "ArrowRight"];
        if (ignore.includes(e.key)) return;
        addMainChar();
    }

    function resetMainCode() {
        mainDisplay = "";
        mainIndex = 0;
        updateMainCode();
    }

    updateMainCode();
    renderDevWindows();
    document.addEventListener("keydown", onKeyPress);
    requestAnimationFrame(animateDevs);
    
    window.openModal = openModal;
    window.closeModal = closeModal;
</script>
</body>
</html>
