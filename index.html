// ========== VECTOR MATH ==========

template<typename T>
class Vec3 {
public:
    T x, y, z;
    
    Vec3() : x(0), y(0), z(0) {}
    Vec3(T x, T y, T z) : x(x), y(y), z(z) {}
    
    Vec3 operator+(const Vec3& v) const {
        return Vec3(x + v.x, y + v.y, z + v.z);
    }
    
    Vec3 operator-(const Vec3& v) const {
        return Vec3(x - v.x, y - v.y, z - v.z);
    }
    
    Vec3 operator*(T s) const {
        return Vec3(x * s, y * s, z * s);
    }
    
    T dot(const Vec3& v) const {
        return x * v.x + y * v.y + z * v.z;
    }
    
    Vec3 cross(const Vec3& v) const {
        return Vec3(
            y * v.z - z * v.y,
            z * v.x - x * v.z,
            x * v.y - y * v.x
        );
    }
    
    T length() const {
        return sqrt(x*x + y*y + z*z);
    }
    
    Vec3 normalize() const {
        T len = length();
        if (len > 0) return Vec3(x/len, y/len, z/len);
        return *this;
    }
};

// ========== MATRIX 4x4 ==========

template<typename T>
class Mat4 {
private:
    T m[4][4];
    
public:
    Mat4() {
        for (int i = 0; i < 4; i++)
            for (int j = 0; j < 4; j++)
                m[i][j] = (i == j) ? 1 : 0;
    }
    
    static Mat4 identity() {
        return Mat4();
    }
    
    static Mat4 translation(T x, T y, T z) {
        Mat4 result;
        result.m[0][3] = x;
        result.m[1][3] = y;
        result.m[2][3] = z;
        return result;
    }
    
    static Mat4 rotationX(T angle) {
        Mat4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[1][1] = c;
        result.m[1][2] = -s;
        result.m[2][1] = s;
        result.m[2][2] = c;
        return result;
    }
    
    static Mat4 rotationY(T angle) {
        Mat4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[0][0] = c;
        result.m[0][2] = s;
        result.m[2][0] = -s;
        result.m[2][2] = c;
        return result;
    }
    
    static Mat4 rotationZ(T angle) {
        Mat4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[0][0] = c;
        result.m[0][1] = -s;
        result.m[1][0] = s;
        result.m[1][1] = c;
        return result;
    }
    
    static Mat4 scale(T x, T y, T z) {
        Mat4 result;
        result.m[0][0] = x;
        result.m[1][1] = y;
        result.m[2][2] = z;
        return result;
    }
    
    Mat4 operator*(const Mat4& other) const {
        Mat4 result;
        for (int i = 0; i < 4; i++) {
            for (int j = 0; j < 4; j++) {
                result.m[i][j] = 0;
                for (int k = 0; k < 4; k++) {
                    result.m[i][j] += m[i][k] * other.m[k][j];
                }
            }
        }
        return result;
    }
    
    Vec3<T> transform(const Vec3<T>& v) const {
        T x = m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z + m[0][3];
        T y = m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z + m[1][3];
        T z = m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z + m[2][3];
        T w = m[3][0] * v.x + m[3][1] * v.y + m[3][2] * v.z + m[3][3];
        return Vec3<T>(x/w, y/w, z/w);
    }
};

// ========== MEMORY POOL ==========

class MemoryPool {
private:
    static constexpr size_t BLOCK_SIZE = 4096;
    static constexpr size_t MAX_BLOCKS = 512;
    
    struct Block {
        void* ptr;
        bool used;
        size_t size;
    };
    
    vector<Block> blocks;
    mutex mtx;
    
public:
    MemoryPool() {
        blocks.reserve(MAX_BLOCKS);
        for (size_t i = 0; i < MAX_BLOCKS; i++) {
            blocks.push_back({malloc(BLOCK_SIZE), false, BLOCK_SIZE});
        }
    }
    
    ~MemoryPool() {
        for (auto& block : blocks) {
            free(block.ptr);
        }
    }
    
    void* allocate(size_t size) {
        lock_guard<mutex> lock(mtx);
        for (auto& block : blocks) {
            if (!block.used && block.size >= size) {
                block.used = true;
                return block.ptr;
            }
        }
        return malloc(size);
    }
    
    void deallocate(void* ptr) {
        lock_guard<mutex> lock(mtx);
        for (auto& block : blocks) {
            if (block.ptr == ptr) {
                block.used = false;
                return;
            }
        }
        free(ptr);
    }
};

using EntityID = uint32_t;

class Component {
public:
    virtual ~Component() = default;
};

template<typename T>
class ComponentManager {
private:
    unordered_map<EntityID, T> components;
    
public:
    void add(EntityID entity, const T& component) {
        components[entity] = component;
    }
    
    void remove(EntityID entity) {
        components.erase(entity);
    }
    
    T& get(EntityID entity) {
        return components[entity];
    }
    
    bool has(EntityID entity) const {
        return components.find(entity) != components.end();
    }
};
