// ========== MATH CORE ==========

template<typename T>
class Vector3 {
public:
    T x, y, z;
    
    Vector3() : x(0), y(0), z(0) {}
    Vector3(T _x, T _y, T _z) : x(_x), y(_y), z(_z) {}
    
    Vector3 operator+(const Vector3& v) const {
        return Vector3(x + v.x, y + v.y, z + v.z);
    }
    
    Vector3 operator-(const Vector3& v) const {
        return Vector3(x - v.x, y - v.y, z - v.z);
    }
    
    Vector3 operator*(T scalar) const {
        return Vector3(x * scalar, y * scalar, z * scalar);
    }
    
    T dot(const Vector3& v) const {
        return x * v.x + y * v.y + z * v.z;
    }
    
    Vector3 cross(const Vector3& v) const {
        return Vector3(
            y * v.z - z * v.y,
            z * v.x - x * v.z,
            x * v.y - y * v.x
        );
    }
    
    T length() const {
        return sqrt(x*x + y*y + z*z);
    }
    
    Vector3 normalize() const {
        T len = length();
        if (len > 0) return Vector3(x/len, y/len, z/len);
        return *this;
    }
};

using Vec3 = Vector3<float>;

// ========== MATRIX ==========

template<typename T>
class Matrix4 {
private:
    T m[4][4];
    
public:
    Matrix4() {
        for (int i = 0; i < 4; i++)
            for (int j = 0; j < 4; j++)
                m[i][j] = (i == j) ? 1 : 0;
    }
    
    static Matrix4 identity() {
        return Matrix4();
    }
    
    static Matrix4 translation(T x, T y, T z) {
        Matrix4 result;
        result.m[0][3] = x;
        result.m[1][3] = y;
        result.m[2][3] = z;
        return result;
    }
    
    static Matrix4 rotationX(T angle) {
        Matrix4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[1][1] = c; result.m[1][2] = -s;
        result.m[2][1] = s; result.m[2][2] = c;
        return result;
    }
    
    static Matrix4 rotationY(T angle) {
        Matrix4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[0][0] = c; result.m[0][2] = s;
        result.m[2][0] = -s; result.m[2][2] = c;
        return result;
    }
    
    static Matrix4 rotationZ(T angle) {
        Matrix4 result;
        T c = cos(angle);
        T s = sin(angle);
        result.m[0][0] = c; result.m[0][1] = -s;
        result.m[1][0] = s; result.m[1][1] = c;
        return result;
    }
    
    static Matrix4 scale(T x, T y, T z) {
        Matrix4 result;
        result.m[0][0] = x;
        result.m[1][1] = y;
        result.m[2][2] = z;
        return result;
    }
    
    Matrix4 operator*(const Matrix4& other) const {
        Matrix4 result;
        for (int i = 0; i < 4; i++) {
            for (int j = 0; j < 4; j++) {
                result.m[i][j] = 0;
                for (int k = 0; k < 4; k++) {
                    result.m[i][j] += m[i][k] * other.m[k][j];
                }
            }
        }
        return result;
    }
    
    Vector3<T> transform(const Vector3<T>& v) const {
        T x = m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z + m[0][3];
        T y = m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z + m[1][3];
        T z = m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z + m[2][3];
        T w = m[3][0] * v.x + m[3][1] * v.y + m[3][2] * v.z + m[3][3];
        return Vector3<T>(x/w, y/w, z/w);
    }
};

// ========== MEMORY POOL ==========

class MemoryArena {
private:
    static constexpr size_t POOL_SIZE = 8192;
    static constexpr size_t MAX_BLOCKS = 1024;
    
    struct Block {
        void* ptr;
        bool used;
        size_t size;
    };
    
    vector<Block> blocks;
    mutex mtx;
    
public:
    MemoryArena() {
        blocks.reserve(MAX_BLOCKS);
        for (size_t i = 0; i < MAX_BLOCKS; i++) {
            blocks.push_back({malloc(POOL_SIZE), false, POOL_SIZE});
        }
    }
    
    ~MemoryArena() {
        for (auto& block : blocks) free(block.ptr);
    }
    
    void* allocate(size_t size) {
        lock_guard<mutex> lock(mtx);
        for (auto& block : blocks) {
            if (!block.used && block.size >= size) {
                block.used = true;
                return block.ptr;
            }
        }
        return malloc(size);
    }
    
    void deallocate(void* ptr) {
        lock_guard<mutex> lock(mtx);
        for (auto& block : blocks) {
            if (block.ptr == ptr) {
                block.used = false;
                return;
            }
        }
        free(ptr);
    }
};

// ========== MAIN SYSTEM ==========

class Application {
private:
    bool running;
    float delta;
    chrono::steady_clock::time_point lastFrame;
    unique_ptr<MemoryArena> memory;
    
public:
    Application() : running(false), delta(0) {
        memory = make_unique<MemoryArena>();
        cout << "[system] initialized" << endl;
    }
    
    bool init() {
        running = true;
        lastFrame = chrono::steady_clock::now();
        return true;
    }
    
    void update() {
        auto now = chrono::steady_clock::now();
        delta = chrono::duration<float>(now - lastFrame).count();
        lastFrame = now;
    }
    
    void render() {
        // render logic
    }
    
    void run() {
        if (!init()) return;
        while (running) {
            update();
            render();
            this_thread::sleep_for(chrono::milliseconds(16));
        }
    }
};

} // namespace engine

int main() {
    auto app = make_unique<engine::Application>();
    app->run();
    return 0;

    let currentIndex = 0;
    let displayText = "";
    const maxChars = fullCode.length;

    const codeDisplay = document.getElementById("codeDisplay");
    const lineNumbersDiv = document.getElementById("lineNumbers");
    const charCountSpan = document.getElementById("charCount");
    const lineCountSpan = document.getElementById("lineCount");
    const progressPercentSpan = document.getElementById("progressPercent");
    const progressFill = document.getElementById("progressFill");

    function updateUI() {
        // Отображаем код
        let escaped = displayText.replace(/&/g, '&amp;')
                                 .replace(/</g, '&lt;')
                                 .replace(/>/g, '&gt;')
                                 .replace(/ /g, '&nbsp;');
        codeDisplay.innerHTML = escaped;
        
        // Номера строк
        const lines = displayText.split('\n');
        const lineCount = lines.length;
        let lineHtml = "";
        for (let i = 1; i <= Math.max(lineCount, 25); i++) {
            lineHtml += i + "<br>";
        }
        lineNumbersDiv.innerHTML = lineHtml;
        
        // Статистика
        charCountSpan.innerText = currentIndex;
        lineCountSpan.innerText = lineCount;
        const percent = Math.floor((currentIndex / maxChars) * 100);
        progressPercentSpan.innerText = percent + "%";
        progressFill.style.width = percent + "%";
        
        // Скролл вниз
        const container = document.querySelector(".code-area");
        container.scrollTop = container.scrollHeight;
    }

    function addChar() {
        if (currentIndex < maxChars) {
            displayText += fullCode[currentIndex];
            currentIndex++;
            updateUI();
            if (currentIndex >= maxChars) {
                document.removeEventListener("keydown", onKeyPress);
            }
        }
    }

    function onKeyPress(e) {
        // Игнорируем служебные клавиши
        const ignore = ["Control", "Alt", "Shift", "Meta", "Escape", "Tab", 
                       "CapsLock", "NumLock", "ScrollLock", "Pause", "Insert",
                       "Home", "PageUp", "Delete", "End", "PageDown"];
        if (ignore.includes(e.key)) return;
        addChar();
    }

    function resetCode() {
        displayText = "";
        currentIndex = 0;
        updateUI();
        document.addEventListener("keydown", onKeyPress);
    }

    updateUI();
    document.addEventListener("keydown", onKeyPress);
