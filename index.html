<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModCodX | Minecraft Cheat Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
        }

        .logo span {
            color: #4ec9b0;
        }

        .sub {
            color: #555;
            font-size: 12px;
        }

        .workspace {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .main-editor {
            flex: 3;
            min-width: 400px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }

        .editor-header {
            background: #141414;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            color: #4ec9b0;
            font-size: 13px;
            font-weight: 600;
        }

        .editor-badge {
            background: #1e1e1e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #888;
        }

        .code-panel {
            display: flex;
            min-height: 550px;
        }

        .line-numbers {
            padding: 20px 12px;
            text-align: right;
            color: #3a3a3a;
            font-size: 12px;
            line-height: 1.6;
            border-right: 1px solid #222;
            background: #0d0d0d;
        }

        .code-area {
            flex: 1;
            padding: 20px;
            background: #0d0d0d;
            overflow-y: auto;
        }

        #codeDisplay {
            color: #d4d4d4;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: #aaa;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .side-panel {
            flex: 1.2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dev-window {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            cursor: grab;
            transition: all 0.1s;
        }

        .dev-window:active {
            cursor: grabbing;
        }

        .dev-window.dragging {
            opacity: 0.5;
        }

        .dev-header {
            background: #141414;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            cursor: grab;
        }

        .dev-header:active {
            cursor: grabbing;
        }

        .dev-name {
            font-size: 11px;
            font-weight: 600;
            color: #e8e8e8;
        }

        .dev-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dev-status {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            background: #1a3a1a;
            color: #4ec9b0;
        }

        .expand-btn {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #aaa;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .expand-btn:hover {
            background: #2a2a2a;
            border-color: #4ec9b0;
            color: #4ec9b0;
        }

        .dev-code {
            padding: 10px 12px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #aaa;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .dev-progress {
            height: 2px;
            background: #222;
        }

        .dev-progress-fill {
            height: 100%;
            width: 0%;
            background: #4ec9b0;
            transition: width 0.02s linear;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info {
            color: #555;
            font-size: 11px;
        }

        button {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            padding: 6px 18px;
            color: #ddd;
            font-family: monospace;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        button:hover {
            background: #252525;
            border-color: #4ec9b0;
            color: #4ec9b0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 40px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            height: 85%;
            background: #0d0d0d;
            border: 1px solid #4ec9b0;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: #141414;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .modal-title {
            color: #4ec9b0;
            font-size: 18px;
            font-weight: 600;
        }

        .close-modal {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-modal:hover {
            background: #2a2a2a;
            border-color: #ff5555;
            color: #ff5555;
        }

        .modal-code {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #d4d4d4;
            white-space: pre-wrap;
            background: #0a0a0a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4ec9b0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <div class="logo">Mod<span>Cod</span>X</div>
            <div class="sub">Minecraft Cheat Development Studio</div>
        </div>
        <div class="info">⚡ collaborative coding · 6 developers online</div>
    </div>

    <div class="workspace">
        <div class="main-editor">
            <div class="editor-header">
                <div class="editor-title">📁 YOU · main.cpp</div>
                <div class="editor-badge">lead developer</div>
            </div>
            <div class="code-panel">
                <div class="line-numbers" id="lineNumbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17<br>18<br>19<br>20</div>
                <div class="code-area">
                    <div id="codeDisplay"></div>
                    <span class="cursor"></span>
                </div>
            </div>
        </div>

        <div class="side-panel" id="sidePanel"></div>
    </div>

    <div class="footer">
        <div class="info">⌨️ Press any key — your code appears (80 chars/sec)</div>
        <div class="info" id="progressInfo">your progress: 0%</div>
        <button onclick="resetMainCode()">⟳ reset your code</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Developer</span>
            <button class="close-modal" onclick="closeModal()">✕ Close</button>
        </div>
        <div class="modal-code" id="modalCode"></div>
    </div>
</div>

<script>
    // ========== ТВОЙ КОД (1500+ символов) ==========
    const yourCode = `#include <iostream>
#include <vector>
#include <thread>
#include <chrono>
#include "MinecraftCheat.h"

using namespace std;

class KillAura {
private:
    float range = 3.4f;
    float cps = 12.5f;
    bool silent = true;
    
public:
    void update() {
        Entity target = getNearestEntity();
        if (target.isValid() && getDistance(target) <= range) {
            attack(target);
        }
    }
    
    Entity getNearestEntity() {
        Entity* best = nullptr;
        float bestDist = range;
        for (Entity e : world.getEntities()) {
            if (e.isPlayer() && !e.isFriend()) {
                float dist = getDistance(e);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = &e;
                }
            }
        }
        return *best;
    }
};

int main() {
    KillAura aura;
    while (true) {
        aura.update();
        this_thread::sleep_for(chrono::milliseconds(50));
    }
    return 0;
}`;

    // ========== КОДЫ РАЗРАБОТЧИКОВ ==========
    const devCodes = [
        { name: "nexus", code: `// AntiCheat Bypass System v3.5
// Support: Grim, Vulcan, Polar

class AntiCheatBypass {
private:
    bool grimBypass = true;
    bool vulcanBypass = true;
    
public:
    void bypassGrim() {
        sendFakeRotation();
        delay(10);
        cancelVelocity();
        packetOrderOptimizer();
    }
    
    void cancelVelocity() {
        if (hurtTime > 0) {
            motionX *= 0.3;
            motionZ *= 0.3;
        }
    }
    
    void sendFakeRotation() {
        float yaw = getCurrentYaw() + rand() % 360;
        sendRotationPacket(yaw);
    }
};` },
        { name: "vortex", code: `// Visual Engine v5.0 - ESP & Render

class VisualEngine {
private:
    bool espEnabled = true;
    Color espColor = Color(0, 255, 0);
    
public:
    void renderAll() {
        for (Entity e : world.getEntities()) {
            if (e.isPlayer() && !e.isFriend()) {
                drawESP(e);
                drawTracer(e);
                drawHealthBar(e);
            }
        }
    }
    
    void drawESP(Entity e) {
        Box box = e.getBoundingBox();
        drawOutline(box, espColor);
        drawNametag(e.getName());
    }
};` },
        { name: "zenix", code: `// Reach & HitBox Module v3.0

class ReachModule {
private:
    float reachDistance = 3.8f;
    bool hitThroughWalls = false;
    
public:
    void onAttack(Entity target) {
        if (getDistance(target) <= reachDistance) {
            target.damage(7.0f);
            if (hitThroughWalls) {
                ignoreCollision(target);
            }
        }
    }
    
    void setReach(float newReach) {
        reachDistance = newReach;
    }
};` },
        { name: "karma", code: `// Velocity & NoKnockback v2.1

class VelocityModule {
private:
    float horizontalReduction = 0.85f;
    bool antiKnockback = true;
    
public:
    void onHurt(Vector3 velocity) {
        velocity.x *= horizontalReduction;
        velocity.z *= horizontalReduction;
        if (antiKnockback) {
            velocity.x = 0;
            velocity.z = 0;
        }
        setVelocity(velocity);
    }
};` },
        { name: "lunar", code: `// Fly & Speed & Flight modes v4.0

class MovementModule {
private:
    bool flyMode = true;
    float flySpeed = 0.3f;
    bool speedEnabled = false;
    
public:
    void onTick() {
        if (flyMode && !isOnGround()) {
            creativeFly();
        }
        if (speedEnabled && isOnGround()) {
            setMotion(motionX * 1.35, motionY, motionZ * 1.35);
        }
    }
};` }
    ];

    // СКОРОСТЬ 80 СИМВОЛОВ В СЕКУНДУ
    const devSpeeds = [80, 80, 80, 80, 80];

    let devStates = devCodes.map((dev, idx) => ({
        name: dev.name,
        fullCode: dev.code,
        currentIndex: 0,
        displayText: "",
        speed: devSpeeds[idx],
        lastUpdate: performance.now(),
        totalChars: dev.code.length
    }));

    let mainIndex = 0;
    let mainDisplay = "";
    const mainTotal = yourCode.length;

    const codeDisplay = document.getElementById("codeDisplay");
    const lineNumbersDiv = document.getElementById("lineNumbers");
    const progressInfo = document.getElementById("progressInfo");
    const sidePanel = document.getElementById("sidePanel");

    function updateMainCode() {
        let escaped = mainDisplay.replace(/&/g, '&amp;')
                                 .replace(/</g, '&lt;')
                                 .replace(/>/g, '&gt;')
                                 .replace(/ /g, '&nbsp;');
        codeDisplay.innerHTML = escaped;
        
        const lines = mainDisplay.split('\n');
        let lineHtml = "";
        for (let i = 1; i <= Math.max(lines.length, 20); i++) {
            lineHtml += i + "<br>";
        }
        lineNumbersDiv.innerHTML = lineHtml;
        
        const percent = Math.floor((mainIndex / mainTotal) * 100);
        progressInfo.innerText = `your progress: ${percent}%`;
        
        const container = document.querySelector(".code-area");
        if (container) container.scrollTop = container.scrollHeight;
    }

    function addMainChar() {
        if (mainIndex < mainTotal) {
            mainDisplay += yourCode[mainIndex];
            mainIndex++;
            updateMainCode();
        }
    }

    function openModal(devName, fullCodeText) {
        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modalTitle");
        const modalCode = document.getElementById("modalCode");
        
        modalTitle.innerText = devName + " · fullscreen code";
        modalCode.innerText = fullCodeText;
        modal.classList.add("active");
    }

    function closeModal() {
        const modal = document.getElementById("modal");
        modal.classList.remove("active");
    }

    // Drag & Drop для перетаскивания окон
    let draggedItem = null;
    let dragOverItem = null;

    function handleDragStart(e, index) {
        draggedItem = index;
        e.target.closest('.dev-window')?.classList.add('dragging');
    }

    function handleDragOver(e, index) {
        e.preventDefault();
        dragOverItem = index;
    }

    function handleDrop() {
        if (draggedItem !== null && dragOverItem !== null && draggedItem !== dragOverItem) {
            const items = [...devStates];
            const dragged = items[draggedItem];
            items.splice(draggedItem, 1);
            items.splice(dragOverItem, 0, dragged);
            devStates = items;
            renderDevWindows();
        }
        draggedItem = null;
        dragOverItem = null;
        document.querySelectorAll('.dev-window').forEach(el => el.classList.remove('dragging'));
    }

    function renderDevWindows() {
        sidePanel.innerHTML = "";
        for (let i = 0; i < devStates.length; i++) {
            const dev = devStates[i];
            const percent = Math.floor((dev.currentIndex / dev.totalChars) * 100);
            
            let codePreview = dev.displayText;
            if (codePreview.length > 150) {
                codePreview = codePreview.substring(0, 147) + "...";
            }
            let escapedCode = codePreview.replace(/&/g, '&amp;')
                                         .replace(/</g, '&lt;')
                                         .replace(/>/g, '&gt;');
            
            const windowDiv = document.createElement('div');
            windowDiv.className = 'dev-window';
            windowDiv.draggable = true;
            windowDiv.setAttribute('data-index', i);
            windowDiv.innerHTML = `
                <div class="dev-header">
                    <span class="dev-name">${dev.name}</span>
                    <div class="dev-controls">
                        <span class="dev-status">${percent}%</span>
                        <button class="expand-btn" data-name="${dev.name}" data-code="${dev.fullCode.replace(/"/g, '&quot;').replace(/\n/g, '\\n')}">⤢</button>
                    </div>
                </div>
                <div class="dev-code">${escapedCode}</div>
                <div class="dev-progress">
                    <div class="dev-progress-fill" style="width: ${percent}%"></div>
                </div>
            `;
            
            windowDiv.addEventListener('dragstart', (e) => handleDragStart(e, i));
            windowDiv.addEventListener('dragover', (e) => handleDragOver(e, i));
            windowDiv.addEventListener('drop', handleDrop);
            
            const expandBtn = windowDiv.querySelector('.expand-btn');
            expandBtn.addEventListener('click', () => {
                openModal(expandBtn.dataset.name, dev.fullCode);
            });
            
            sidePanel.appendChild(windowDiv);
        }
    }

    function updateDevCode(dev, now) {
        const timeDelta = Math.min(0.1, (now - dev.lastUpdate) / 1000);
        const charsToAdd = Math.floor(dev.speed * timeDelta);
        
        if (charsToAdd > 0 && dev.currentIndex < dev.totalChars) {
            let newIndex = Math.min(dev.currentIndex + charsToAdd, dev.totalChars);
            dev.displayText += dev.fullCode.substring(dev.currentIndex, newIndex);
            dev.currentIndex = newIndex;
        }
        dev.lastUpdate = now;
    }

    function animateDevs(now) {
        let anyActive = false;
        for (let i = 0; i < devStates.length; i++) {
            if (devStates[i].currentIndex < devStates[i].totalChars) {
                anyActive = true;
                updateDevCode(devStates[i], now);
            }
        }
        renderDevWindows();
        if (anyActive) {
            requestAnimationFrame(animateDevs);
        }
    }

    function onKeyPress(e) {
        const ignore = ["Control", "Alt", "Shift", "Meta", "Escape", "Tab", 
                       "CapsLock", "NumLock", "ScrollLock", "Pause", "Insert",
                       "Home", "PageUp", "Delete", "End", "PageDown", "ArrowUp", 
                       "ArrowDown", "ArrowLeft", "ArrowRight"];
        if (ignore.includes(e.key)) return;
        addMainChar();
        if (mainIndex >= mainTotal) {
            document.removeEventListener("keydown", onKeyPress);
        }
    }

    function resetMainCode() {
        mainDisplay = "";
        mainIndex = 0;
        updateMainCode();
        document.addEventListener("keydown", onKeyPress);
    }

    updateMainCode();
    renderDevWindows();
    document.addEventListener("keydown", onKeyPress);
    requestAnimationFrame(animateDevs);
    
    window.openModal = openModal;
    window.closeModal = closeModal;
</script>
</body>
</html>
